<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Zgłoś problem ze zdjęciem i lokalizacją. Sąsiedzi popierają — urząd widzi heatmapę." />
    <meta name="theme-color" content="#f3ecdf" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Courier+Prime&family=Fredoka:wght@400..700&family=Fraunces:ital,opsz,wght@0,9..144,500..900;1,9..144,500..900&display=swap"
    />
    <title>ImpaktMałopolska</title>
    <script>
      // Motyw ustawiony przed pierwszym renderem — bez mignięcia przy kawaii mode.
      try {
        if (localStorage.getItem("impakt-theme") === "kawaii") {
          document.documentElement.dataset.theme = "kawaii";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#ffeef6");
        }
      } catch {}
    </script>
  </head>
  <body class="flex min-h-full flex-col antialiased">
    <div id="root" class="flex min-h-screen flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
